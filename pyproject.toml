[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-audio"
version = "0.1.0"
description = "Connectome-inspired audio experiments: a fly-hearing circuit as sequencer, sampler, and (later) VST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bchap1n" }]
keywords = [
    "connectome",
    "drosophila",
    "audio",
    "sequencer",
    "sampler",
    "spiking-neural-network",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
flybrain-audio = "flybrain_audio.cli:main"

[project.urls]
Homepage = "https://github.com/bchap1n/flybrain-audio"
Issues = "https://github.com/bchap1n/flybrain-audio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
